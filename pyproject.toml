[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eff-len"
version = "0.1.0"
description = "Spectral measure of diversity for multiple sequence alignments"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Vaitea Opuu", email = "vaitea.opuu@cnrs.fr"}]
keywords = ["bioinformatics", "msa", "sequence-alignment", "diversity"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy"]

[project.urls]
Homepage = "https://github.com/vaiteaopuu/effective_length"
Issues = "https://github.com/vaiteaopuu/effective_length/issues"